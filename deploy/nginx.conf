# Nginx config for orangehack.com — serves IWSDK static build + proxies WebSocket to PTY server
server {
    listen 443 ssl http2;
    server_name orangehack.com;

    ssl_certificate /etc/letsencrypt/live/orangehack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orangehack.com/privkey.pem;

    root /var/www/quest/dist;
    index index.html;

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }

    # WebSocket proxy to PTY server
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|glb|gltf|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name orangehack.com;
    return 301 https://$server_name$request_uri;
}
